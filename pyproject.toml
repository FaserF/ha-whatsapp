[tool.poetry]
name = "ha-whatsapp"
version = "2.1.4-dev0"
description = "Home Assistant WhatsApp Integration"
authors = ["FaserF"]
readme = "README.md"
packages = [{include = "custom_components"}]

[tool.poetry.dependencies]
python = "^3.12"
# Add actual dependencies here

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.0"
pytest-homeassistant-custom-component = "^0.13"
ruff = "^0.16.0"
mypy = "^2.0.0"
black = "^26.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]
ignore = ["E501", "B008", "SIM102", "SIM105", "SIM117", "E402", "B017", "B904", "ARG001", "RUF012", "DTZ003", "DTZ007", "DTZ001", "DTZ005", "BLE001", "S110", "S112"]

[tool.ruff.lint.per-file-ignores]
".github/scripts/*.py" = ["T201", "E501", "SIM102"]
"scripts/*.py" = ["T201", "E501", "SIM102"]

[tool.mypy]
explicit_package_bases = true
python_version = "3.14"
strict = true
ignore_missing_imports = true
warn_unused_ignores = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = "."
addopts = "-p no:socket"
