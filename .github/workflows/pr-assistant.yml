name: PR Assistant

on:
  push:
    branches: ["main"]

jobs:
  auto-fix:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]' && github.actor != 'faserf-hermes-agent[bot]'
    permissions:
      contents: write
    steps:
      - name: Generate GitHub App token for Hermes
        id: app-token
        if: ${{ secrets.BOT_APP_ID != '' && secrets.BOT_PRIVATE_KEY != '' }}
        uses: actions/create-github-app-token@v3
        continue-on-error: true
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.15'
      - name: Install Ruff/Black
        run: pip install ruff black
      - name: Run Auto-fix
        run: |
          ruff check . --fix --exit-zero
          black .
      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: auto-fix linting issues"
          branch: ${{ github.ref_name }}
          commit_user_name: "faserf-hermes-agent[bot]"
          commit_user_email: "342667397+faserf-hermes-agent[bot]@users.noreply.github.com"
          commit_author: "faserf-hermes-agent[bot] <342667397+faserf-hermes-agent[bot]@users.noreply.github.com>"
